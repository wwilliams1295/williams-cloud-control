[mypy]
python_version = 3.9
strict_optional = True
warn_redundant_casts = True
warn_unused_configs = True
# Keep this off for now; some third-party types produce noise
warn_unused_ignores = False

# Don’t blow up on third-party libs without stubs
ignore_missing_imports = True
follow_imports = silent

# Project-wide defaults
disallow_untyped_defs = True
no_implicit_optional = True

# Relax rules in integration-heavy or test code
[mypy-tests.*]
disallow_untyped_defs = False
disallow_any_generics = False

[mypy-plugins.*]
disallow_untyped_defs = False
warn_return_any = False

[mypy-core.capabilities]
disallow_untyped_defs = False
warn_return_any = False

[mypy-mailer]
disallow_untyped_defs = False
warn_return_any = False

[mypy-onedrive_device_login]
disallow_untyped_defs = False
warn_return_any = False

[mypy-test_integrations]
disallow_untyped_defs = False
warn_return_any = False

[mypy-tools.ai_patch]
disallow_untyped_defs = False
warn_return_any = False
