services:
  - type: web
    name: williams-cloud-control
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn cloud:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: PPLX_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_TLS
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: ENABLE_SEND_PDF
        value: "1"
      - key: FORCE_PERPLEXITY_WEB
        value: "1"
      - key: PREFER_PERPLEXITY
        value: "1"
      - key: PPLX_MODEL
        value: "sonar"
      - key: PPLX_MAX_TOKENS
        value: "700"



